[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notodata"
version = "0.1.0"
description = "Noto 2024 building-collapse dataset pipeline (HFL rewrite)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "huggingface_hub>=2.0",
    "datasets>=3.0",
    "requests>=2.32",
    "Pillow>=10.4",
    "geopandas>=1.0",
    "pyogrio>=0.10",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# GPU/encoder extras; never installed by the core image, so the build needs no GPU.
embed = [
    "torch>=2.4",
    "timm>=1.0",
    "open_clip_torch>=2.26",
]

[project.scripts]
notodata = "notodata.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "complexipy>=3.0",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notodata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "real: runs on the built table under NOTODATA_HOME; fails (not skips) when it is missing",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "NPY", "PD"]

[tool.ruff.lint.per-file-ignores]
# tests build pandas frames named df and use stub arithmetic with magic numbers
"tests/**" = ["PD901"]

[tool.complexipy]
paths = ["src"]
max-complexity-allowed = 10
